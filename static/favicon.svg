<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ManageIT koru mark, simplified: three sweeping lime outer rings, open
       breathing space, and a tight dark inner cluster — like the logo -->
  <g fill="none" stroke-linecap="round">
    <!-- outer sweep -->
    <circle cx="31.5" cy="31.5" r="29" stroke="#829c00" stroke-width="2.8"
            stroke-dasharray="132 200" transform="rotate(58 31.5 31.5)"/>
    <circle cx="31.5" cy="31.5" r="24.5" stroke="#829c00" stroke-width="2.8"
            stroke-dasharray="86 12 26 200" transform="rotate(96 31.5 31.5)"/>
    <circle cx="31.5" cy="31.5" r="20" stroke="#829c00" stroke-width="2.8"
            stroke-dasharray="66 200" transform="rotate(120 31.5 31.5)"/>
    <!-- lone mid arcs -->
    <circle cx="31.5" cy="31.5" r="20" stroke="#829c00" stroke-width="2.8"
            stroke-dasharray="22 200" transform="rotate(-40 31.5 31.5)"/>
    <circle cx="33" cy="33.5" r="14" stroke="#3f6d00" stroke-width="2.8"
            stroke-dasharray="30 200" transform="rotate(150 33 33.5)"/>
    <!-- tight inner cluster, nudged right+down like the logo -->
    <circle cx="33" cy="33.5" r="8.5" stroke="#3f6d00" stroke-width="2.6"
            stroke-dasharray="46 100" transform="rotate(-75 33 33.5)"/>
    <circle cx="33" cy="33.5" r="3.8" stroke="#3f6d00" stroke-width="2.5"
            stroke-dasharray="13.5 100" transform="rotate(115 33 33.5)"/>
  </g>
</svg>
