<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#16a34a" />
		<meta name="robots" content="index, follow" />
		<meta name="author" content="ManageIT" />
		<link rel="canonical" href="https://manageit.nz" />

		<link rel="dns-prefetch" href="//manage-it.screenconnect.com">
		<link rel="dns-prefetch" href="//aus.myconnectwise.net">
		<link rel="dns-prefetch" href="//outlook.office365.com">

		<!-- Preload critical assets -->
		<link rel="preload" href="%sveltekit.assets%/manageit-logo.png" as="image" type="image/png">
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
